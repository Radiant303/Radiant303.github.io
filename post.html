<!DOCTYPE html>
<!--
  Radiant303 · 文章页
  ------------------------------------------------------------------
  阅读 content/ 下的 Markdown：post.html?f=xxx.md 或 post.html?d=tech&f=xxx.md
  与首页同一套视觉：素白纸面、春绿点缀，文章直接印在页面上，不用卡片。
  液态玻璃仅返回按钮一枚，作为点缀。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章 · Radiant303</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231c7c50'/%3E%3Crect x='6' y='6' width='52' height='52' rx='7' fill='none' stroke='%23ffffff' stroke-opacity='.7' stroke-width='2.5'/%3E%3Ctext x='32' y='44' font-family='serif' font-size='32' text-anchor='middle' fill='%23ffffff'%3E%E6%98%A5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #ffffff;          /* 素白 */
  --ink: #13293d;            /* 深夜蓝黑 */
  --ink-2: rgba(19, 41, 61, .64);
  --ink-3: rgba(19, 41, 61, .42);
  --spring: #1c7c50;         /* 春绿，唯一强调色 */
  --hairline: rgba(19, 41, 61, .16);
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --mono: "JetBrains Mono", "SF Mono", "Cascadia Code", "Consolas", monospace;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--serif);
  font-weight: 400;
  color: var(--ink);
  background: var(--paper);
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100svh;
}
::selection { background: rgba(28, 124, 80, .16); }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--spring); outline-offset: 3px; border-radius: 4px; }

/* 液态玻璃：仅返回按钮一枚 */
.glass {
  position: relative;
  border-radius: var(--r, 999px);
  background: linear-gradient(135deg, rgba(255,255,255,.30), rgba(255,255,255,.08) 55%, rgba(255,255,255,.20));
  box-shadow: 0 10px 30px rgba(19, 41, 61, .14), 0 2px 6px rgba(19, 41, 61, .06);
}
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  border: 1px solid rgba(255, 255, 255, .65);
  border-bottom-color: rgba(19, 41, 61, .12);
  pointer-events: none;
}
.glass::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .7),
    inset 1px 0 0 rgba(255, 255, 255, .25),
    inset -1px 0 0 rgba(255, 255, 255, .16),
    inset 0 -1px 0 rgba(19, 41, 61, .08);
  pointer-events: none;
}
.glass-fallback .glass, .no-js .glass {
  background: rgba(255, 255, 255, .5);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}

.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  padding: 16px 0;
}
.topbar .in {
  width: min(760px, calc(100% - 40px)); margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
}
.back {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 18px; font-size: 13.5px;
  color: var(--ink); --r: 999px;
}
.back span { transition: transform .3s var(--ease-out); }
.back:hover span { transform: translateX(-3px); }
.brand { font-weight: 900; font-size: 15px; letter-spacing: .03em; }

.wrap { max-width: 760px; margin: 0 auto; padding: 128px 24px 90px; }
.page-in { animation: pageIn .8s var(--ease-out) both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .page-in { animation: none; } }

/* 文章直接印在纸上：无卡片、无边框 */
.date { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--spring); margin-bottom: 14px; }
h1 {
  font-weight: 900;
  font-size: clamp(1.75rem, 4.4vw, 2.5rem); line-height: 1.35; letter-spacing: .01em;
}
.head-rule {
  display: flex; align-items: center; gap: 12px;
  margin: 26px 0 34px;
}
.head-rule i { width: 26px; height: 5px; background: var(--spring); border-radius: 2px; }
.head-rule::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }

.prose { font-size: 15.5px; line-height: 1.95; color: var(--ink-2); }
.prose p + p { margin-top: .85em; }
.prose h2, .prose h3, .prose h4 { color: var(--ink); line-height: 1.5; margin: 1.6em 0 .6em; font-weight: 900; }
.prose h2 { font-size: 1.32em; }
.prose h3 { font-size: 1.16em; } .prose h4 { font-size: 1.04em; }
.prose > :first-child { margin-top: 0; }
.prose a { color: var(--spring); text-decoration: underline; text-underline-offset: 3px; }
.prose strong { color: var(--ink); font-weight: 900; }
.prose code {
  font-family: var(--mono); font-size: .84em;
  background: rgba(19, 41, 61, .06); border: 1px solid rgba(19, 41, 61, .10);
  padding: .12em .42em; border-radius: 5px; word-break: break-all;
}
.prose pre {
  background: #232323;
  border-radius: 10px; padding: 15px 18px; overflow-x: auto; margin: 1em 0;
}
.prose pre code { background: none; border: 0; padding: 0; font-size: 13px; line-height: 1.75; color: #e9e9e6; }
.prose ul, .prose ol { padding-left: 1.4em; margin: .6em 0; }
.prose li + li { margin-top: .3em; }
.prose blockquote { border-left: 2px solid var(--spring); padding-left: 14px; margin: .9em 0; }
.prose hr { border: 0; border-top: 1px solid var(--hairline); margin: 1.5em 0; }
.prose img { max-width: 100%; border-radius: 10px; display: block; margin: 1em 0; }

/* GitHub 仓库卡片：md 里单独一行的仓库链接自动渲染成卡片 */
.gh-card { margin: 1.1em 0; }
.gh-card .ghc-plain { color: var(--spring); }
a.ghc, .prose a.ghc {
  display: block; padding: 15px 18px 13px;
  background: #fff; border: 1px solid var(--hairline); border-radius: 12px;
  color: var(--ink); text-decoration: none;
  transition: border-color .25s, box-shadow .25s var(--ease-out), transform .25s var(--ease-out);
}
a.ghc:hover {
  border-color: rgba(19, 41, 61, .30);
  box-shadow: 0 10px 26px rgba(19, 41, 61, .09);
  transform: translateY(-2px);
}
.ghc-head { display: flex; align-items: center; gap: 9px; }
.ghc-head img { width: 20px; height: 20px; border-radius: 50%; flex: none; }
.ghc-name { font-size: 15px; color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ghc-name b { color: var(--ink); font-weight: 900; }
.ghc-site { margin-left: auto; font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; color: var(--ink-3); flex: none; }
.ghc-desc { display: block; font-size: 14px; color: var(--ink-2); margin-top: 9px; line-height: 1.7; }
.ghc-meta { display: flex; align-items: center; gap: 18px; margin-top: 11px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.ghc-meta svg { width: 12px; height: 12px; vertical-align: -1.5px; fill: currentColor; margin-right: 5px; }
.ghc-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--spring); margin-right: 6px; }

.foot-note {
  margin-top: 64px; padding-top: 22px;
  border-top: 1px solid var(--hairline);
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em;
  color: var(--ink-3);
}
.foot-note a { color: var(--spring); }
.foot-note a:hover { text-decoration: underline; text-underline-offset: 3px; }
.missing { text-align: center; padding: 60px 0; }
.missing p { color: var(--ink-2); font-size: 14.5px; }
</style>
<noscript><style>
  .glass { background: rgba(255,255,255,.5); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
</style></noscript>
</head>

    <a class="brand" href="index.html">Radiant303</a>

<main class="wrap page-in">

<script>
(function () {
  'use strict';

  /* ============ SVG 位移着色器（与首页同一套，MIT 思路致谢见首页注释） ============ */
  var NS = 'http://www.w3.org/2000/svg';
  var XL = 'http://www.w3.org/1999/xlink';

  function smoothStep(a, b, t) {
    t = Math.max(0, Math.min(1, (t - a) / (b - a)));

  function sdfRoundRect(x, y, w, h, r) {

  var svgRoot = null, defs = null, seq = 0;
  function ensureSvg() {
    if (svgRoot) return;
    svgRoot = document.createElementNS(NS, 'svg');
    svgRoot.setAttribute('width', '0');
    svgRoot.setAttribute('height', '0');
    svgRoot.setAttribute('aria-hidden', 'true');
    svgRoot.style.cssText = 'position:fixed;left:0;top:0;pointer-events:none;overflow:hidden';
    defs = document.createElementNS(NS, 'defs');

    document.body.insertBefore(svgRoot, document.body.firstChild);

  function buildMap(w, h, dpr, fragment) {
    var cw = Math.max(2, Math.round(w * dpr));
    var ch = Math.max(2, Math.round(h * dpr));

  function buildMask(w, h, dpr, radius) {
    var cw = Math.max(2, Math.round(w * dpr));
    var ch = Math.max(2, Math.round(h * dpr));

    canvas.width = cw; canvas.height = ch;
    var ctx = canvas.getContext('2d');
    var r = Math.min(radius * dpr, cw / 2, ch / 2);
    var o = 2 * dpr;
    ctx.beginPath();
    if (ctx.roundRect) {

      var rr = r + o, x0 = -o, y0 = -o, x1 = cw + o, y1 = ch + o;

      ctx.arcTo(x1, y1, x0, y1, rr);
      ctx.arcTo(x0, y1, x0, y0, rr);
      ctx.arcTo(x0, y0, x1, y0, rr);
      ctx.closePath();

    ctx.fill();

  }

    f.setAttribute('color-interpolation-filters', 'sRGB');
    f.setAttribute('x', '0'); f.setAttribute('y', '0');
    f.setAttribute('width', w); f.setAttribute('height', h);
    var fe = document.createElementNS(NS, 'feImage');
    fe.setAttribute('result', 'map');
    fe.setAttribute('preserveAspectRatio', 'none');
    fe.setAttribute('width', w); fe.setAttribute('height', h);

    dm.setAttribute('in', 'SourceGraphic');
    dm.setAttribute('in2', 'map');
    dm.setAttribute('xChannelSelector', 'R');
    dm.setAttribute('yChannelSelector', 'G');
    dm.setAttribute('result', 'disp');
    var feMask = document.createElementNS(NS, 'feImage');
    feMask.setAttribute('result', 'mask');
    feMask.setAttribute('preserveAspectRatio', 'none');
    feMask.setAttribute('width', w); feMask.setAttribute('height', h);
    var comp = document.createElementNS(NS, 'feComposite');
    comp.setAttribute('in', 'disp');
    comp.setAttribute('in2', 'mask');

    var t = null;
    return function () { clearTimeout(t); t = setTimeout(fn, ms); };

    var R = Math.min(opts.radius, Math.min(w, h) / 2);
    var B = opts.bezel, rim = opts.rim, mag = opts.mag;

        x: 0.5 + (u - 0.5) * (1 - mag) - (nx * pull) / w,

      radius: parseFloat(el.dataset.radius || '24'),

      filter.node.setAttribute('height', h);

      filter.fe.setAttribute('height', h);

      filter.feMask.setAttribute('height', h);

  /* ============ Markdown 渲染（与首页同一套） ============ */
  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function mdSafeUrl(u) { return /^(https?:\/\/|mailto:|\/|#)/i.test(u); }
  function mdInline(s) {
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (m, a, u) {
      return mdSafeUrl(u) ? '<img alt="' + a + '" src="' + u + '">' : m;
    });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, t, u) {
      return mdSafeUrl(u) ? '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>' : t;
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^\w*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    return s;
  }
  function md(src) {
    var lines = src.replace(/\r\n?/g, '\n').split('\n');
    var out = [], i = 0;
    var blockStart = /^(```|#{1,4}\s|\s*[-*]\s|\s*\d+\.\s|\s*>\s?|\s*---+\s*$)/;
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      if (/^```/.test(line)) {
        var code = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
        i++;
        out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>');
        continue;
      }
      var h = line.match(/^(#{1,4})\s+(.*)$/);
      if (h) {
        var lv = h[1].length + 1;
        out.push('<h' + lv + '>' + mdInline(esc(h[2].trim())) + '</h' + lv + '>');
        i++; continue;
      }
      if (/^\s*---+\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
      if (/^\s*>\s?/.test(line)) {
        var q = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ''));
        out.push('<blockquote>' + md(q.join('\n')) + '</blockquote>');
        continue;
      }
      if (/^\s*[-*]\s+/.test(line)) {
        var ul = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i]))

        out.push('<ul>' + ul.join('') + '</ul>');
        continue;
      }
      if (/^\s*\d+\.\s+/.test(line)) {
        var ol = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i]))
          ol.push('<li>' + mdInline(esc(lines[i++].replace(/^\s*\d+\.\s+/, '').trim())) + '</li>');
        out.push('<ol>' + ol.join('') + '</ol>');
        continue;
      }
      var para = [];
      while (i < lines.length && lines[i].trim() && !blockStart.test(lines[i])) para.push(lines[i++]);
      var ptext = para.join('');
      /* 单独一行的 GitHub 仓库链接 → 仓库卡片（加载失败就保持纯链接） */
      var gm = ptext.trim().match(/^(?:https?:\/\/)?github\.com\/([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+?)\/?$/);

        out.push('<div class="gh-card" data-repo="' + gm[1] + '"><a class="ghc-plain" href="https://github.com/' + gm[1] +

      } else {
        out.push('<p>' + mdInline(esc(ptext)) + '</p>');
      }
    }
    return out.join('\n');
  }

  /* ============ GitHub 仓库卡片：单独一行的仓库链接 → 卡片 ============ */
  var ghCache = {};
  function ghNum(n) { return n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(n); }
  function ghCardHtml(r) {
    var star = '<svg viewBox="0 0 16 16"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>';
    var fork = '<svg viewBox="0 0 16 16"><path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"/></svg>';
    return '<a class="ghc" href="' + r.html_url + '" target="_blank" rel="noopener">' +
      '<span class="ghc-head"><img src="' + r.owner.avatar_url + '&amp;s=64" alt="" loading="lazy">' +
      '<span class="ghc-name">' + esc(r.owner.login) + ' / <b>' + esc(r.name) + '</b></span>' +
      '<span class="ghc-site">GITHUB</span></span>' +
      (r.description ? '<span class="ghc-desc">' + esc(r.description) + '</span>' : '') +
      '<span class="ghc-meta">' +
      (r.language ? '<span><i class="ghc-dot"></i>' + esc(r.language) + '</span>' : '') +
      '<span>' + star + ghNum(r.stargazers_count) + '</span>' +
      '<span>' + fork + ghNum(r.forks_count) + '</span>' +
      '</span></a>';
  }
  async function hydrateGhCards(root) {
    if (location.protocol === 'file:') return;
    var boxes = (root || document).querySelectorAll('.gh-card[data-repo]');
    for (var i = 0; i < boxes.length; i++) {
      var repo = boxes[i].getAttribute('data-repo');
      try {
        if (!(repo in ghCache)) {
          var res = await fetch('https://api.github.com/repos/' + repo);
          ghCache[repo] = res.ok ? await res.json() : null;
        }
        var r = ghCache[repo];
        if (r && r.html_url) boxes[i].innerHTML = ghCardHtml(r);
      } catch (e) { /* 保留纯链接 */ }
    }
  }

  /* ============ 加载文章 ============ */
  function fail(msg) {
    var t = document.getElementById('post-title');
    var b = document.getElementById('post-body');
    var d = document.getElementById('post-date');
    if (d) d.textContent = '';
    if (t) t.textContent = '没有找到这篇文章';
    if (b) b.innerHTML = '<div class="missing"><p>' + msg + '</p><p style="margin-top:14px"><a href="index.html" style="color:var(--spring);text-decoration:underline;text-underline-offset:3px">回到首页 →</a></p></div>';
  }

  async function loadPost() {
    var q = new URLSearchParams(location.search);
    var d = q.get('d') || '';
    var f = q.get('f') || '';
    /* 文件名白名单：只允许字母数字与 . _ -，防路径穿越 */
    var ok = /^[a-zA-Z0-9._-]+$/.test(f) && f.indexOf('..') < 0 &&
             (!d || (/^[a-zA-Z0-9._-]+$/.test(d) && d.indexOf('..') < 0));
    if (!ok || !f) { fail('链接里缺少有效的文章名。'); return; }
    if (location.protocol === 'file:') {
      fail('本地直接双击打开时读不到 Markdown——请通过 GitHub Pages 访问，或在目录里起一个本地服务器（如 python -m http.server）。');
      return;
    }
    var path = 'content/' + (d ? d + '/' : '') + f;
    try {
      var res = await fetch(path);
      if (!res.ok) { fail('文章不存在，或者还没有同步过来。'); return; }
      var src = await res.text();
      var m = f.match(/^(\d{4})-(\d{2})-(\d{2})/);
      var date = m ? m[1] + ' · ' + m[2] + ' · ' + m[3] : '';
      var title = '', tm = src.match(/^\s*#\s+(.+)$/m);
      if (tm) { title = tm[1].trim(); src = src.replace(tm[0], ''); }
      document.getElementById('post-date').textContent = date;
      document.getElementById('post-title').textContent = title || f;
      document.getElementById('post-body').innerHTML = md(src);
      hydrateGhCards(document.getElementById('post-body'));
      document.title = (title || f) + ' · Radiant303';
    } catch (e) {
      fail('网络不太好，文章没加载出来。');
    }
  }

  function init() {
    document.querySelectorAll('[data-glass]').forEach(attachGlass);
    loadPost();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
