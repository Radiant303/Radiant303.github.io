<!DOCTYPE html>
<!--
  Radiant303 · 文章页
  ------------------------------------------------------------------
  阅读 content/ 下的 Markdown：post.html?f=xxx.md 或 post.html?d=articles&f=xxx.md
  与首页同一套视觉：素白纸面、春绿点缀，文章直接印在页面上，不用卡片。
  液态玻璃仅返回按钮一枚，作为点缀。
  样式：assets/css/base.css + assets/css/post.css；
  脚本：assets/js/glass.js + assets/js/markdown.js + assets/js/post.js。
-->
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章 · Radiant303</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/post.css">
<noscript><style>

</style></noscript>
</head>
<body>

<header class="topbar" id="topbar">
  <a class="back glass" data-glass data-radius="999" data-bezel="14" data-rim="8" data-mag="0.08" href="index.html"><span>←</span>首页</a>
  <a class="brand" href="index.html"></a>
</header>

<main class="wrap page-in">

    <p class="date" id="post-date"></p>
    <h1 id="post-title">加载中…</h1>
    <div class="head-rule" aria-hidden="true"><i></i></div>
    <div class="prose" id="post-body"></div>
  </article>
  <nav class="post-nav" id="post-nav" aria-label="上一篇 / 下一篇"></nav>
</main>

<script src="assets/js/glass.js"></script>
<script src="assets/js/markdown.js"></script>

</body>
</html>
