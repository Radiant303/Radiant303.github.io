<!DOCTYPE html>
<!--
  Radiant303 · 个人博客
  ------------------------------------------------------------------
  封面是 resource/background.png（新海诚风原野），画面底部溶进纯白正文区。
  · 液态玻璃：SVG feDisplacementMap 折射，思路致谢 shuding/svg-shaders
    与 shuding/liquid-glass（MIT）。全站仅顶部导航滑块一处，作为点缀。
  · 导航：页面顶部时品牌与链接分居两侧，下滑后向中间聚拢。
  · 标题逐字升起；滚动渐显 IntersectionObserver。
  · 每个字都能在 Markdown 里改（见 README），全部走相对路径读 content/：
      content/site.md      → 页面上的所有固定文案（hero/导航/节标题/速览/页脚）
      content/files.md     → 文件清单（作品/文章各列文件名）
      content/about.md     → 「关于我」正文
      content/projects/    → 作品，一个项目一个 md
      content/articles/    → 文章，经 post.html 阅读
  · 原生 JS 手写，无框架、无构建；样式与脚本按页面拆分：
      assets/css/base.css   → 两页共用（变量/玻璃/Markdown 骨架/GitHub 卡片）
      assets/css/index.css  → 本页特有
      assets/js/glass.js    → 液态玻璃（两页共用）
      assets/js/markdown.js → Markdown 渲染与 GitHub 卡片（两页共用）
      assets/js/index.js    → 本页逻辑
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiant303 · 个人博客</title>
<meta name="description" content="Radiant303 的个人博客：项目、文章——也是一份活着的简历。">
<meta name="theme-color" content="#a9d6ef">
<meta property="og:title" content="Radiant303 · 个人博客">
<meta property="og:description" content="项目、文章——也是一份活着的简历。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://radiant303.github.io/resource/background.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Radiant303 · 个人博客">
<meta name="twitter:description" content="项目、文章——也是一份活着的简历。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='none' stroke='%231c7c50' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M32 56 V36'/%3E%3Cpath d='M32 36 C24 34 17 27 15 15 C27 17 32 26 32 36 Z'/%3E%3Cpath d='M32 36 C40 34 47 27 49 15 C37 17 32 26 32 36 Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/index.css">
<noscript><style>
  [data-reveal] { opacity: 1 !important; transform: none !important; }
  .title .ch > span { transform: none !important; }
</style></noscript>
</head>
<body>

<header class="nav" id="nav">
  <div class="bar">
    <!-- 品牌与导航文字由 content/site.md 的 brand / ## nav 注入 -->
    <a class="brand" href="#top" id="brand"></a>
    <nav class="seg" id="seg" aria-label="页面导航">
      <a href="#about"></a>
      <a href="#work"></a>
      <a href="#articles"></a>
      <a href="#contact"></a>
      <span class="thumb glass" data-glass data-radius="999" data-bezel="16" data-rim="9" data-mag="0.09" aria-hidden="true"></span>
    </nav>
  </div>
</header>

<main>

  <!-- Hero：新海诚封面 -->
  <section class="hero" id="top">
    <div class="inkbg" aria-hidden="true"></div>
    <div class="hero-in wrap">
      <!-- 文案全部由 content/site.md 的 ## hero 注入，无硬编码兜底 -->
      <h1 class="title" id="title"></h1>
      <div class="hero-foot">
        <p class="sub" id="h-sub" data-reveal></p>
        <p class="hint" id="h-hint" data-reveal style="transition-delay:.15s"></p>
        <p class="time" data-reveal style="transition-delay:.25s"><span id="h-time"></span> <span id="clock">--:--:--</span> · UTC+8</p>
      </div>
      <p class="cue" aria-hidden="true"><span id="h-cue"></span><i></i></p>
    </div>
  </section>

  <!-- 关于 -->
  <section id="about" data-section="about">
    <div class="wrap">
      <div class="sec-head" data-reveal>
        <span class="sec-no" aria-hidden="true">01</span>
        <h2 class="sec-title"></h2>
        <span class="sec-en">About</span>
      </div>
      <!-- facts 由 JS 根据 content/site.md 的 ## about 列表渲染，无硬编码兜底 -->
      <dl class="facts" id="facts" data-reveal></dl>
      <div class="about-prose" data-reveal>
        <!-- 正文由 JS 读取 content/about.md 渲染，无硬编码兜底 -->
        <div class="prose" id="about-body"></div>
      </div>
      <!-- GitHub 贡献热力图：数据来自公开 JSON 接口，按站点色阶手绘 -->
      <div class="contrib" id="contrib" data-reveal>
        <div class="cg-board">
          <p class="cg-cap">GITHUB<span class="cg-dot" aria-hidden="true">·</span><span id="cg-total">贡献热力图 · 过去一年</span></p>
          <div class="cg-grid" id="cg-grid"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 作品 -->
  <section id="work" data-section="work">
    <div class="wrap">
      <div class="sec-head" data-reveal>
        <span class="sec-no" aria-hidden="true">02</span>
        <h2 class="sec-title"></h2>
        <span class="sec-en">Work</span>
      </div>
      <p class="sec-sub" data-reveal></p>
      <div class="works" id="works"></div>
    </div>
  </section>

  <!-- 文章 -->
  <section id="articles" data-section="articles">
    <div class="wrap">
      <div class="sec-head" data-reveal>
        <span class="sec-no" aria-hidden="true">03</span>
        <h2 class="sec-title"></h2>
        <span class="sec-en">Articles</span>
      </div>
      <p class="sec-sub" data-reveal></p>
      <!-- 条目由 JS 根据 content/files.md 的 ## articles 清单动态渲染，无硬编码兜底 -->
      <div class="entries" id="articles-list" data-reveal></div>
    </div>
  </section>

</main>

<footer id="contact">
  <div class="wrap">
    <div class="foot" data-reveal>
      <!-- 落款与链接由 content/site.md 的 ## footer 注入 -->
      <p class="who"><span id="f-who"></span></p>
      <div class="links" id="f-links"></div>
      <p class="note" id="f-note"></p>
    </div>
  </div>
</footer>

<script src="assets/js/glass.js"></script>
<script src="assets/js/markdown.js"></script>
<script src="assets/js/index.js"></script>
</body>
</html>
